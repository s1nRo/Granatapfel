[project]
name = "Granatapfel"
version = "0.0.1"
description = "Гранатовое дерево способно расти и плодоносить в крайне суровых, засушливых условиях, где другие растения погибают."
readme = "README.md"
license = "Apache-2.0"

dependencies = [
    "fastapi>=0.136.3",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "requests>=2.34.2",
    "ruff>=0.15.15",
]

requires-python = ">=3.11.9"
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirror"]

[mypy]
python_version = "3.11.9"

[tool.mypy]
strict = true